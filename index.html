<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Skills Test</title>
    
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            text-align: center;
        }
        
        .main-card {
            width: 100%;
            max-width: 550px;
            background: #ffffff;
            border: 3px solid rgb(122, 185, 86);
            border-radius: 15px;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.15);
            padding: 35px;
            margin: 15px;
        }

        h1 {
            color: rgb(26, 136, 4);
            font-weight: 700;
            margin-bottom: 25px;
        }

        #result1 {
            display: none;
            border: 3px solid rgb(73, 193, 17);
            box-shadow: 0px 5px 15px rgba(200, 200, 200, 0.5);
            border-radius: 10px;
            padding: 20px;
            margin-top: 25px;
            background-color: #f8f9ff;
            font-size: 20px;
            text-align: left;
        }

        .property-row {
            margin-bottom: 8px;
        }

        .property-label {
            font-weight: 600;
            color: rgb(68, 136, 4);
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>da    NON-METALS</h1>
        <p class="text-muted mb-4">Enter a non-metal symbol (e.g., H, C, O, Cl) to view details.</p>

        <div class="input-group mb-3">
            <input type="text" id="nonmetal" class="form-control form-control-lg" placeholder="Enter Symbol..." aria-label="Element Symbol">
            <button class="btn btn-primary btn-lg" type="button" py-click="find" style="background-color: rgb(4, 136, 22); border-color: rgb(4, 50, 136);">Search</button>
        </div>

        <div id="result1">
            <div class="property-row"><span class="property-label">Symbol:</span> <span id="symbol">-</span></div>
            <div class="property-row"><span class="property-label">Name:</span> <span id="name">-</span></div>
            <div class="property-row"><span class="property-label">Atomic Number:</span> <span id="number">-</span></div>
            <div class="property-row"><span class="property-label">Atomic Mass:</span> <span id="mass">-</span></div>
        </div>
         <p style="color: #e01414; font-size: 14px;">PLEASE note: Only NON-METAL elements are supported.</p>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
